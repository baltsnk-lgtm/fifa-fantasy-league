<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FIFA Fantasy — Закрита ліга</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --pitch-dark: #071e14;
    --card: #0e2c1d;
    --card-hover: #123723;
    --gold: #d9b44a;
    --gold-soft: rgba(217,180,74,0.14);
    --white: #f3f1e8;
    --muted: rgba(243,241,232,0.55);
    --muted-2: rgba(243,241,232,0.35);
    --line: rgba(243,241,232,0.10);
    --up: #57c07a;
    --down: #e2685f;
    --font-display: "Space Grotesk", "Inter", sans-serif;
    --font-body: "Inter", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--pitch-dark);
    background-image: repeating-linear-gradient(90deg, rgba(255,255,255,0.015) 0 1px, transparent 1px 90px);
    color: var(--white);
    font-family: var(--font-body);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  header {
    padding: 36px 20px 0;
    text-align: center;
    max-width: 980px;
    margin: 0 auto;
  }
  .eyebrow {
    font-family: var(--font-display);
    letter-spacing: 3px;
    text-transform: uppercase;
    font-size: 11px;
    font-weight: 600;
    color: var(--gold);
    margin-bottom: 10px;
  }
  h1 {
    font-family: var(--font-display);
    margin: 0;
    font-size: clamp(30px, 5vw, 46px);
    font-weight: 700;
    letter-spacing: -0.5px;
  }
  .meta {
    margin-top: 10px;
    font-size: 13px;
    color: var(--muted);
  }
  nav.tabs {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    gap: 4px;
    overflow-x: auto;
    max-width: 980px;
    margin: 28px auto 0;
    padding: 6px;
    background: rgba(7,30,20,0.92);
    backdrop-filter: blur(6px);
    border: 1px solid var(--line);
    border-radius: 14px;
    scrollbar-width: thin;
  }
  nav.tabs button {
    flex: 0 0 auto;
    font-family: var(--font-display);
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    background: transparent;
    border: none;
    padding: 10px 16px;
    border-radius: 10px;
    cursor: pointer;
    white-space: nowrap;
    transition: color .15s, background .15s;
  }
  nav.tabs button:hover { color: var(--white); }
  nav.tabs button.active {
    color: #0c2417;
    background: var(--gold);
  }
  main {
    max-width: 980px;
    margin: 0 auto;
    padding: 20px 16px 70px;
  }
  section.panel { display: none; }
  section.panel.active { display: block; animation: fade .2s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  h2.panel-title {
    font-family: var(--font-display);
    font-size: 15px;
    font-weight: 600;
    color: var(--gold);
    margin: 4px 0 4px;
  }
  p.panel-sub {
    font-size: 12.5px;
    color: var(--muted);
    margin: 0 0 16px;
    line-height: 1.5;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    overflow: hidden;
  }
  .scrollx { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  thead th {
    position: sticky;
    top: 0;
    text-align: left;
    font-family: var(--font-display);
    font-size: 10.5px;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--muted);
    padding: 12px 10px;
    font-weight: 600;
    background: var(--card);
    border-bottom: 1px solid var(--line);
    white-space: nowrap;
  }
  th.num, td.num { text-align: right; }
  th.ctr, td.ctr { text-align: center; }
  tbody tr { transition: background .1s; }
  tbody tr:hover { background: var(--card-hover); }
  tbody tr:not(:last-child) td { border-bottom: 1px solid var(--line); }
  td { padding: 11px 10px; vertical-align: middle; white-space: nowrap; }
  td.name-cell { white-space: normal; }
  .rank-num {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 15px;
    color: var(--muted);
    width: 26px;
    display: inline-block;
  }
  tr.top3 .rank-num { color: var(--gold); }
  .delta { font-size: 11px; font-weight: 700; margin-left: 4px; }
  .delta.up { color: var(--up); }
  .delta.down { color: var(--down); }
  .delta.flat { color: var(--muted-2); }
  .player-row { display: flex; align-items: center; gap: 10px; }
  .avatar { width: 26px; height: 26px; border-radius: 50%; background: rgba(255,255,255,0.08); flex: none; }
  .pname { font-weight: 600; }
  .team-link { cursor: pointer; }
  .team-link:hover .pname { color: var(--gold); text-decoration: underline; }
  .psub { font-size: 11px; color: var(--muted); margin-top: 1px; }
  .points-big {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 16px;
    font-variant-numeric: tabular-nums;
  }
  .points-sm { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .spark polyline { fill: none; stroke: var(--gold); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .spark { display: block; }
  .pill {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 999px;
    background: var(--gold-soft);
    color: var(--gold);
    white-space: nowrap;
  }
  .pill.off { background: rgba(243,241,232,0.06); color: var(--muted-2); }
  .pill.bad { background: rgba(226,104,95,0.14); color: var(--down); }
  .tag { font-size: 10.5px; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 1px 5px; margin-left: 5px; }
  .state {
    text-align: center;
    padding: 60px 16px;
    color: var(--muted);
    font-size: 14px;
  }
  .state.error { color: var(--down); }
  .duel-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 14px;
    font-size: 14px;
    border-bottom: 1px solid var(--line);
  }
  .duel-item:last-child { border-bottom: none; }
  .duel-item b { color: var(--gold); }
  footer {
    text-align: center;
    padding: 26px;
    font-size: 11.5px;
    color: var(--muted-2);
  }
  ::-webkit-scrollbar { height: 6px; width: 6px; }
  ::-webkit-scrollbar-thumb { background: rgba(243,241,232,0.15); border-radius: 4px; }

  /* ---------- Team detail modal ---------- */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(3,12,7,0.72);
    backdrop-filter: blur(2px);
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 24px 14px;
    overflow-y: auto;
    z-index: 100;
  }
  .modal-overlay[hidden] { display: none; }
  .modal-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    width: 100%;
    max-width: 640px;
    padding: 22px 20px 26px;
    animation: fade .15s ease;
  }
  .modal-close {
    float: right;
    background: rgba(255,255,255,0.06);
    border: none;
    color: var(--muted);
    width: 30px;
    height: 30px;
    border-radius: 50%;
    font-size: 16px;
    cursor: pointer;
    line-height: 1;
  }
  .modal-close:hover { color: var(--white); background: rgba(255,255,255,0.12); }
  .modal-head { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
  .modal-head img.avatar { width: 40px; height: 40px; }
  .modal-head h3 { font-family: var(--font-display); margin: 0; font-size: 20px; }
  .modal-head .psub { font-size: 12.5px; }
  .modal-stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin: 16px 0;
  }
  .modal-stats .stat {
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 10px;
    text-align: center;
  }
  .modal-stats .stat .v { font-family: var(--font-display); font-weight: 700; font-size: 17px; }
  .modal-stats .stat .l { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-top: 2px; }
  .round-picker { display: flex; gap: 4px; flex-wrap: wrap; margin: 14px 0; }
  .round-picker button {
    font-family: var(--font-display);
    font-size: 12px;
    font-weight: 600;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--muted);
    padding: 5px 11px;
    border-radius: 8px;
    cursor: pointer;
  }
  .round-picker button.active { background: var(--gold); color: #0c2417; border-color: var(--gold); }
  .squad-group { margin-top: 14px; }
  .squad-group h4 {
    font-family: var(--font-display);
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 6px;
  }
  .squad-player {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 7px 10px;
    border-radius: 8px;
    font-size: 13.5px;
  }
  .squad-player:nth-child(odd) { background: rgba(255,255,255,0.025); }
  .squad-player .badge {
    display: inline-block;
    font-size: 9.5px;
    font-weight: 700;
    color: #0c2417;
    background: var(--gold);
    border-radius: 5px;
    padding: 1px 4px;
    margin-left: 6px;
  }
  .squad-player .badge.v { background: rgba(217,180,74,0.35); color: var(--gold); }
  .squad-player .out { opacity: 0.4; text-decoration: line-through; }
  .mini-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
  .mini-card { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
  .mini-card .l { font-size: 10px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); }
  .mini-card .n { font-weight: 600; margin-top: 3px; }
  .mini-card .p { font-size: 12px; color: var(--muted); }

  /* ---------- Cursor glow / micro-interactions ---------- */
  html { scroll-behavior: smooth; }
  #cursorGlow {
    position: fixed;
    width: 420px; height: 420px;
    border-radius: 50%;
    pointer-events: none;
    background: radial-gradient(circle, rgba(217,180,74,0.12) 0%, rgba(217,180,74,0) 68%);
    transform: translate(-50%,-50%);
    left: -500px; top: -500px;
    z-index: 3;
    will-change: left, top;
  }
  @media (hover: none), (pointer: coarse) { #cursorGlow { display: none; } }
  .card { transition: box-shadow .2s, transform .2s; }
  tbody tr { transition: background .12s, transform .12s; }
  tbody tr:hover { transform: translateX(2px); }
  nav.tabs button, .round-picker button, .modal-close, .quiz-opt, .filter-row button {
    transition: background .15s, color .15s, border-color .15s, transform .1s;
  }
  nav.tabs button:active, .round-picker button:active, .modal-close:active, .quiz-opt:active, .filter-row button:active {
    transform: scale(0.95);
  }
  .modal-card { animation: modalPop .18s cubic-bezier(.2,.8,.3,1); }
  @keyframes modalPop { from { opacity: 0; transform: scale(0.96) translateY(6px); } to { opacity: 1; transform: none; } }

  /* ---------- Chip filter row ---------- */
  .filter-row { display: flex; gap: 6px; flex-wrap: wrap; margin: 4px 0 16px; }
  .filter-row button {
    font-family: var(--font-display);
    font-size: 12px;
    font-weight: 600;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--muted);
    padding: 6px 13px;
    border-radius: 999px;
    cursor: pointer;
  }
  .filter-row button:hover { color: var(--white); border-color: var(--gold); }
  .filter-row button.active { background: var(--gold); color: #0c2417; border-color: var(--gold); }
  .filter-row button.filter-reset { border-color: rgba(226,104,95,0.4); color: var(--down); }
  .filter-row button.filter-reset:hover { background: rgba(226,104,95,0.14); border-color: var(--down); }
  .chip-mode-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: -8px 0 16px; }
  .chip-mode-label { font-size: 11.5px; color: var(--muted-2); }
  .chip-mode-row button {
    font-family: var(--font-display); font-size: 11px; font-weight: 600;
    border: 1px solid var(--line); background: transparent; color: var(--muted);
    padding: 4px 11px; border-radius: 999px; cursor: pointer;
  }
  .chip-mode-row button.active { background: rgba(217,180,74,0.18); color: var(--gold); border-color: var(--gold); }

  /* ---------- Football pitch formation view ---------- */
  .pitch-wrap { margin-top: 14px; }
  .pitch {
    position: relative;
    background: repeating-linear-gradient(180deg, #123f28 0px, #123f28 38px, #0e3722 38px, #0e3722 76px);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 16px;
    padding: 20px 6px 16px;
    overflow: hidden;
  }
  .pitch::before {
    content: ""; position: absolute; left: 50%; top: 50%;
    width: 92px; height: 92px; border: 1px solid rgba(255,255,255,0.18);
    border-radius: 50%; transform: translate(-50%,-50%); pointer-events: none;
  }
  .pitch::after {
    content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px;
    background: rgba(255,255,255,0.18); pointer-events: none;
  }
  .pitch-row { display: flex; justify-content: space-evenly; gap: 4px; margin: 9px 0; position: relative; z-index: 1; }
  .pitch-card { display: flex; flex-direction: column; align-items: center; width: 64px; text-align: center; }
  .pitch-card .dot {
    width: 36px; height: 36px; border-radius: 50%; background: var(--gold); color: #0c2417;
    font-weight: 700; font-size: 10.5px; display: flex; align-items: center; justify-content: center;
    position: relative; box-shadow: 0 2px 8px rgba(0,0,0,.35); transition: transform .15s;
  }
  .pitch-card:hover .dot { transform: scale(1.08); }
  .pitch-card .badge2 {
    position: absolute; top: -5px; right: -5px; background: #0c2417; border: 1px solid var(--gold);
    color: var(--gold); font-size: 8px; font-weight: 700; border-radius: 4px; padding: 0 3px; line-height: 1.3;
  }
  .pitch-card .pname2 {
    font-size: 10px; margin-top: 4px; font-weight: 600; line-height: 1.2; max-width: 64px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .pitch-card .pts2 { font-size: 10px; color: var(--gold); font-weight: 700; margin-top: 1px; }

  /* ---------- Big form chart ---------- */
  .big-chart { display: block; }

  /* ---------- Transfer history list ---------- */
  .transfer-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 10px; border-radius: 8px; font-size: 12.5px;
  }
  .transfer-item:nth-child(odd) { background: rgba(255,255,255,0.025); }
  .transfer-item .tout { color: var(--down); }
  .transfer-item .tin { color: var(--up); }

  /* ---------- Mini-game: penalty shootout ---------- */
  .pen-card { padding: 18px; text-align: center; }
  #penCanvas {
    width: 100%; max-width: 560px; height: auto; border-radius: 14px;
    cursor: crosshair; touch-action: none; background: #123f28;
    box-shadow: 0 6px 20px rgba(0,0,0,0.3);
  }
  .pen-stats { display: flex; justify-content: center; gap: 22px; margin-top: 14px; font-size: 12.5px; color: var(--muted); flex-wrap: wrap; }
  .pen-stats b { color: var(--gold); font-family: var(--font-display); font-size: 14px; }
  .pen-msg { margin-top: 12px; font-size: 15px; font-weight: 700; min-height: 22px; font-family: var(--font-display); }
  .pen-hint { font-size: 11.5px; color: var(--muted-2); margin-top: 6px; }
</style>
</head>
<body>
  <div id="cursorGlow"></div>
  <header>
    <div class="eyebrow">Закрита ліга · FIFA World Cup 2026</div>
    <h1>Fantasy Leaderboard</h1>
    <div class="meta" id="updated">Завантаження…</div>
  </header>

  <nav class="tabs" id="tabs"></nav>

  <main id="main">
    <div class="state" id="loading">Завантаження даних ліги…</div>
  </main>

  <footer>Оновлюється автоматично щогодини · FIFA World Cup 2026 Fantasy</footer>

  <div class="modal-overlay" id="teamModal" hidden>
    <div class="modal-card" id="teamModalCard"></div>
  </div>

<script>
const CHIP_FIELDS = [
  ["wildCard", "Wildcard"],
  ["twelfthMan", "12th Man"],
  ["maxCaptain", "Max Captain"],
  ["maxCaptainBooster", "Captain Booster"],
  ["cleanSheet", "Clean Sheet"],
  ["qualification", "Qualification"],
];

const TABS = [
  { id: "table", label: "Таблиця" },
  { id: "chips", label: "Чіпи" },
  { id: "captains", label: "Капітани" },
  { id: "transfers", label: "Трансфери" },
  { id: "bench", label: "Лава" },
  { id: "ownership", label: "Шаблон" },
  { id: "diffs", label: "Диференціали" },
  { id: "duels", label: "Дуелі" },
  { id: "game", label: "Пенальті" },
];

// Ambient cursor glow — purely cosmetic, follows the pointer across the page.
(function initCursorGlow() {
  const glow = document.getElementById("cursorGlow");
  if (!glow) return;
  window.addEventListener("pointermove", (e) => {
    glow.style.left = e.clientX + "px";
    glow.style.top = e.clientY + "px";
  }, { passive: true });
})();

function esc(str) {
  const d = document.createElement("div");
  d.textContent = str == null ? "" : String(str);
  return d.innerHTML;
}

function fmtDate(iso) {
  if (!iso) return "ще не оновлювалось";
  const d = new Date(iso);
  if (isNaN(d.getTime())) return "ще не оновлювалось";
  return "Оновлено " + d.toLocaleString("uk-UA", {
    day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit",
  });
}

function sparkline(values, w, h) {
  w = w || 84; h = h || 26;
  if (!values.length) return "";
  const max = Math.max(...values, 1);
  const min = Math.min(...values, 0);
  const range = (max - min) || 1;
  const step = w / Math.max(values.length - 1, 1);
  const pts = values.map((v, i) => (i * step).toFixed(1) + "," + (h - ((v - min) / range) * h).toFixed(1)).join(" ");
  return `<svg viewBox="0 0 ${w} ${h}" class="spark" width="${w}" height="${h}"><polyline points="${pts}" /></svg>`;
}

async function main() {
  let history, players, squads;
  try {
    [history, players, squads] = await Promise.all([
      fetch("data/history.json", { cache: "no-store" }).then((r) => { if (!r.ok) throw new Error("history HTTP " + r.status); return r.json(); }),
      fetch("data/players.json", { cache: "no-store" }).then((r) => r.ok ? r.json() : []),
      fetch("data/squads.json", { cache: "no-store" }).then((r) => r.ok ? r.json() : []),
    ]);
  } catch (err) {
    document.getElementById("updated").textContent = "Помилка оновлення";
    document.getElementById("main").innerHTML = `<div class="state error">Не вдалося завантажити дані: ${esc(err.message)}</div>`;
    return;
  }

  const teamsObj = history.teams || {};
  const teamIds = Object.keys(teamsObj);
  if (!teamIds.length) {
    document.getElementById("updated").textContent = "ще не оновлювалось";
    document.getElementById("main").innerHTML = `<div class="state">Дані ще не завантажені. Перевір за годину.</div>`;
    return;
  }

  const currentRound = history.current_round || 1;
  const rounds = Array.from({ length: currentRound }, (_, i) => i + 1);

  const teams = teamIds.map((id) => ({ id, ...teamsObj[id] }));
  teams.sort((a, b) => (a.overallRank ?? 999) - (b.overallRank ?? 999));

  const playerMap = new Map((players || []).map((p) => [p.id, p]));
  const squadMap = new Map((squads || []).map((s) => [s.id, s]));

  function playerName(id) {
    const p = playerMap.get(id);
    if (!p) return "#" + id;
    return p.knownName || [p.firstName, p.lastName].filter(Boolean).join(" ") || ("#" + id);
  }
  function playerSquadAbbr(id) {
    const p = playerMap.get(id);
    if (!p) return "";
    const s = squadMap.get(p.squadId);
    return s ? s.abbr : "";
  }
  function playerRoundPoints(id, round) {
    const p = playerMap.get(id);
    if (!p || !p.stats || !p.stats.roundPoints) return 0;
    const v = p.stats.roundPoints[String(round)];
    return typeof v === "number" ? v : 0;
  }

  function computeRankAt(round) {
    const arr = teams.map((t) => ({ id: t.id, pts: t.rounds && t.rounds[String(round)] ? t.rounds[String(round)].overallPoints : null }));
    arr.sort((a, b) => (b.pts ?? -Infinity) - (a.pts ?? -Infinity));
    const m = new Map();
    arr.forEach((t, i) => m.set(t.id, i + 1));
    return m;
  }
  const currRankMap = computeRankAt(currentRound);
  const prevRankMap = currentRound > 1 ? computeRankAt(currentRound - 1) : null;

  function latestRoundData(team) {
    for (let r = currentRound; r >= 1; r--) {
      if (team.rounds && team.rounds[String(r)]) return { round: r, data: team.rounds[String(r)] };
    }
    return { round: null, data: null };
  }

  function flattenRoster(grouped) {
    if (!grouped) return [];
    return Object.values(grouped).flat();
  }

  // ---------- Ownership across the league (based on latest round squads) ----------
  const ownership = new Map(); // playerId -> count
  teams.forEach((t) => {
    const { data } = latestRoundData(t);
    if (!data) return;
    const ids = new Set([...flattenRoster(data.lineup), ...flattenRoster(data.bench)]);
    ids.forEach((id) => ownership.set(id, (ownership.get(id) || 0) + 1));
  });
  const numTeams = teams.length;
  let chipFilterSelected = new Set();
  let chipFilterMode = "any"; // "any" = used at least one selected chip, "all" = used every selected chip

  function teamUsedChips(t) {
    const { data } = latestRoundData(t);
    return new Set(CHIP_FIELDS.filter(([f]) => data && data[f] != null).map(([f]) => f));
  }

  // =========================================================================
  // TAB: Leaderboard
  // =========================================================================
  function renderTable() {
    const chipButtons = CHIP_FIELDS.map(([field, label]) =>
      `<button data-chiptoggle="${esc(field)}" class="${chipFilterSelected.has(field) ? "active" : ""}">${esc(label)}</button>`
    ).join("");
    const resetBtn = chipFilterSelected.size
      ? `<button data-chipreset class="filter-reset">Скинути ✕</button>`
      : "";
    const modeRow = chipFilterSelected.size > 1 ? `
      <div class="chip-mode-row">
        <span class="chip-mode-label">Показати тих, хто зіграв:</span>
        <button data-chipmode="any" class="${chipFilterMode === "any" ? "active" : ""}">будь-який з обраних</button>
        <button data-chipmode="all" class="${chipFilterMode === "all" ? "active" : ""}">усі обрані одразу</button>
      </div>` : "";

    const filteredTeams = teams.filter((t) => {
      if (!chipFilterSelected.size) return true;
      const used = teamUsedChips(t);
      const selectedArr = Array.from(chipFilterSelected);
      return chipFilterMode === "all"
        ? selectedArr.every((f) => used.has(f))
        : selectedArr.some((f) => used.has(f));
    });

    if (!filteredTeams.length) {
      return `
        <h2 class="panel-title">Таблиця ліги</h2>
        <p class="panel-sub">Тур ${currentRound}. Обери конкретні чіпи, щоб відфільтрувати команди, які їх зіграли.</p>
        <div class="filter-row">${chipButtons}${resetBtn}</div>
        ${modeRow}
        <div class="state">Немає команд, що відповідають фільтру.</div>`;
    }

    const rows = filteredTeams.map((t, i) => {
      const rank = t.overallRank ?? (i + 1);
      const top3 = rank <= 3 ? " top3" : "";
      const cr = currRankMap.get(t.id);
      const pr = prevRankMap ? prevRankMap.get(t.id) : null;
      let deltaHtml = `<span class="delta flat">—</span>`;
      if (pr != null && cr != null) {
        const d = pr - cr;
        if (d > 0) deltaHtml = `<span class="delta up">▲${d}</span>`;
        else if (d < 0) deltaHtml = `<span class="delta down">▼${-d}</span>`;
        else deltaHtml = `<span class="delta flat">=</span>`;
      }
      const series = rounds.map((r) => (t.rounds && t.rounds[String(r)] ? (t.rounds[String(r)].roundPoints || 0) : 0));
      let bestR = null, worstR = null;
      rounds.forEach((r) => {
        if (!t.rounds || !t.rounds[String(r)]) return;
        const pts = t.rounds[String(r)].roundPoints || 0;
        if (bestR === null || pts > bestR.pts) bestR = { round: r, pts };
        if (worstR === null || pts < worstR.pts) worstR = { round: r, pts };
      });
      const badges = (bestR && worstR && bestR.round !== worstR.round)
        ? `<span class="tag" title="Найкращий тур">🔥${bestR.pts} (т${bestR.round})</span><span class="tag" title="Найгірший тур">📉${worstR.pts} (т${worstR.round})</span>`
        : "";
      return `
        <tr class="${top3.trim()}">
          <td><span class="rank-num">${rank}</span>${deltaHtml}</td>
          <td class="name-cell">
            <div class="player-row team-link" data-team="${esc(t.id)}">
              <img class="avatar" src="${esc(t.avatar || "")}" alt="" onerror="this.style.visibility='hidden'">
              <div>
                <div class="pname">${esc(t.userName)}</div>
                <div class="psub">${badges}</div>
              </div>
            </div>
          </td>
          <td>${sparkline(series)}</td>
          <td class="num points-sm">${t.roundPoints ?? "—"}</td>
          <td class="num points-big">${t.overallPoints ?? "—"}</td>
        </tr>`;
    }).join("");
    return `
      <h2 class="panel-title">Таблиця ліги</h2>
      <p class="panel-sub">Тур ${currentRound}. Стрілка — зміна місця відносно попереднього туру. 🔥/📉 — найкращий і найгірший тур учасника. Обери конкретні чіпи нижче, щоб відфільтрувати.</p>
      <div class="filter-row">${chipButtons}${resetBtn}</div>
      ${modeRow}
      <div class="card scrollx"><table>
        <thead><tr><th>#</th><th>Гравець</th><th>Форма</th><th class="num">Тур</th><th class="num">Очки</th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>`;
  }

  // =========================================================================
  // TAB: Chips
  // =========================================================================
  function chipRound(val) {
    if (val == null) return null;
    return typeof val === "object" ? val.roundId : val;
  }

  function renderChips() {
    const rows = teams.map((t) => {
      const { data } = latestRoundData(t);
      const used = CHIP_FIELDS.filter(([f]) => data && data[f] != null).length;
      const cells = CHIP_FIELDS.map(([field]) => {
        const val = data ? data[field] : null;
        const roundNum = chipRound(val);
        if (roundNum == null) return `<td class="ctr"><span class="pill off">—</span></td>`;
        const playerExtra = (val && typeof val === "object" && val.playerId) ? ` · ${playerName(val.playerId)}` : "";
        return `<td class="ctr"><span class="pill">Тур ${roundNum}${esc(playerExtra)}</span></td>`;
      }).join("");
      return `
        <tr>
          <td class="name-cell"><div class="pname team-link" data-team="${esc(t.id)}">${esc(t.userName)}</div></td>
          ${cells}
          <td class="ctr">${used}/${CHIP_FIELDS.length}</td>
        </tr>`;
    }).join("");
    const headers = CHIP_FIELDS.map(([, label]) => `<th class="ctr">${esc(label)}</th>`).join("");
    return `
      <h2 class="panel-title">Використані чіпи</h2>
      <p class="panel-sub">В якому турі гравець зіграв кожну фішку. "—" означає, що чіп ще в запасі.</p>
      <div class="card scrollx"><table>
        <thead><tr><th>Гравець</th>${headers}<th class="ctr">Разом</th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>`;
  }

  // =========================================================================
  // TAB: Captains
  // =========================================================================
  function renderCaptains() {
    const totals = new Map();
    const rows = teams.map((t) => {
      let total = 0;
      const cells = rounds.map((r) => {
        const rd = t.rounds && t.rounds[String(r)];
        if (!rd || rd.captain == null) return `<td class="ctr points-sm">—</td>`;
        const pts = playerRoundPoints(rd.captain, r);
        total += pts;
        const name = playerName(rd.captain);
        return `<td class="ctr"><div class="pname" style="font-size:12.5px">${esc(name)}</div><div class="points-sm">${pts} очок</div></td>`;
      }).join("");
      totals.set(t.id, total);
      return { html: `<tr><td class="name-cell"><div class="pname team-link" data-team="${esc(t.id)}">${esc(t.userName)}</div></td>${cells}<td class="ctr points-big">${total}</td></tr>`, total };
    });
    rows.sort((a, b) => b.total - a.total);
    const headers = rounds.map((r) => `<th class="ctr">Тур ${r}</th>`).join("");
    return `
      <h2 class="panel-title">Капітанські вибори</h2>
      <p class="panel-sub">Скільки "сирих" очок (без урахування помноження) набрав капітан кожного менеджера в кожному турі.</p>
      <div class="card scrollx"><table>
        <thead><tr><th>Гравець</th>${headers}<th class="ctr">Разом</th></tr></thead>
        <tbody>${rows.map((r) => r.html).join("")}</tbody>
      </table></div>`;
  }

  // =========================================================================
  // TAB: Transfers
  // =========================================================================
  function renderTransfers() {
    const rows = teams.map((t) => {
      const { data } = latestRoundData(t);
      const transfers = (data && data.transfers) || [];
      const hits = transfers.filter((x) => x.isNegative).length;
      const free = data ? data.freeTransfers : "—";
      return { id: t.id, userName: t.userName, total: transfers.length, hits, free: free ?? "—" };
    }).sort((a, b) => b.hits - a.hits || b.total - a.total);
    const rowsHtml = rows.map((r) => `
      <tr>
        <td class="name-cell"><div class="pname team-link" data-team="${esc(r.id)}">${esc(r.userName)}</div></td>
        <td class="num">${r.total}</td>
        <td class="ctr">${r.hits ? `<span class="pill bad">${r.hits}</span>` : `<span class="pill off">0</span>`}</td>
        <td class="num">${r.free}</td>
      </tr>`).join("");
    return `
      <h2 class="panel-title">Трансфери</h2>
      <p class="panel-sub">Всього трансферів із початку сезону, скільки з них були "хітами" (платні), і скільки безкоштовних лишилось про запас.</p>
      <div class="card scrollx"><table>
        <thead><tr><th>Гравець</th><th class="num">Всього</th><th class="ctr">Хіти</th><th class="num">В банку</th></tr></thead>
        <tbody>${rowsHtml}</tbody>
      </table></div>`;
  }

  // =========================================================================
  // TAB: Bench waste
  // =========================================================================
  function renderBench() {
    const rows = teams.map((t) => {
      let total = 0, worst = null;
      rounds.forEach((r) => {
        const rd = t.rounds && t.rounds[String(r)];
        if (!rd) return;
        const autoIn = new Set((rd.substitutions || []).filter((s) => s.isAuto).map((s) => s.in));
        const benchIds = flattenRoster(rd.bench).filter((id) => !autoIn.has(id));
        const pts = benchIds.reduce((sum, id) => sum + playerRoundPoints(id, r), 0);
        total += pts;
        if (worst === null || pts > worst.pts) worst = { round: r, pts };
      });
      return { id: t.id, userName: t.userName, total, worst };
    }).sort((a, b) => b.total - a.total);
    const rowsHtml = rows.map((r) => `
      <tr>
        <td class="name-cell"><div class="pname team-link" data-team="${esc(r.id)}">${esc(r.userName)}</div></td>
        <td class="num points-big">${r.total}</td>
        <td class="num points-sm">${r.worst ? `${r.worst.pts} (тур ${r.worst.round})` : "—"}</td>
      </tr>`).join("");
    return `
      <h2 class="panel-title">Очки на лаві</h2>
      <p class="panel-sub">Скільки очок набрали гравці на лаві запасних (без урахування тих, кого підключила автозаміна). Найбільше зверху — гірший менеджмент складу.</p>
      <div class="card scrollx"><table>
        <thead><tr><th>Гравець</th><th class="num">Разом втрачено</th><th class="num">Найгірший тур</th></tr></thead>
        <tbody>${rowsHtml}</tbody>
      </table></div>`;
  }

  // =========================================================================
  // TAB: Ownership / template
  // =========================================================================
  function renderOwnership() {
    const arr = Array.from(ownership.entries()).map(([id, count]) => ({ id, count }));
    arr.sort((a, b) => b.count - a.count);
    const top = arr.slice(0, 18);
    const rowsHtml = top.map((x) => {
      const pct = Math.round((x.count / numTeams) * 100);
      const p = playerMap.get(x.id);
      return `
        <tr>
          <td class="name-cell"><div class="pname">${esc(playerName(x.id))}</div><div class="psub">${esc(p ? p.position : "")} ${playerSquadAbbr(x.id) ? "· " + esc(playerSquadAbbr(x.id)) : ""}</div></td>
          <td class="num">${x.count}/${numTeams}</td>
          <td class="num points-big">${pct}%</td>
        </tr>`;
    }).join("");
    return `
      <h2 class="panel-title">Шаблонний склад ліги</h2>
      <p class="panel-sub">Найпопулярніші гравці серед усіх ${numTeams} команд ліги за останній тур.</p>
      <div class="card scrollx"><table>
        <thead><tr><th>Гравець</th><th class="num">Команд</th><th class="num">% ліги</th></tr></thead>
        <tbody>${rowsHtml}</tbody>
      </table></div>`;
  }

  // =========================================================================
  // TAB: Differentials
  // =========================================================================
  function renderDiffs() {
    const threshold = Math.max(1, Math.round(numTeams * 0.15));
    const arr = Array.from(ownership.entries())
      .map(([id, count]) => ({ id, count, pts: playerRoundPoints(id, currentRound) }))
      .filter((x) => x.count <= threshold && x.pts > 0)
      .sort((a, b) => b.pts - a.pts)
      .slice(0, 12);
    if (!arr.length) {
      return `<h2 class="panel-title">Диференціали</h2><p class="panel-sub">Малопопулярні гравці ліги, які дали багато очок в останньому турі.</p><div class="state">Поки що немає яскравих диференціалів.</div>`;
    }
    const rowsHtml = arr.map((x) => {
      const p = playerMap.get(x.id);
      const owners = teams.filter((t) => {
        const { data } = latestRoundData(t);
        if (!data) return false;
        const ids = new Set([...flattenRoster(data.lineup), ...flattenRoster(data.bench)]);
        return ids.has(x.id);
      }).map((t) => t.userName).join(", ");
      return `
        <tr>
          <td class="name-cell"><div class="pname">${esc(playerName(x.id))}</div><div class="psub">${esc(p ? p.position : "")} ${playerSquadAbbr(x.id) ? "· " + esc(playerSquadAbbr(x.id)) : ""}</div></td>
          <td class="num points-big">${x.pts}</td>
          <td class="num">${x.count}/${numTeams}</td>
          <td class="name-cell psub">${esc(owners)}</td>
        </tr>`;
    }).join("");
    return `
      <h2 class="panel-title">Диференціали туру ${currentRound}</h2>
      <p class="panel-sub">Гравці, яких взяли ≤${threshold} команд ліги, але вони набрали найбільше очок цього туру.</p>
      <div class="card scrollx"><table>
        <thead><tr><th>Гравець</th><th class="num">Очок (тур)</th><th class="num">Команд</th><th>Хто взяв</th></tr></thead>
        <tbody>${rowsHtml}</tbody>
      </table></div>`;
  }

  // =========================================================================
  // TAB: Duels
  // =========================================================================
  function renderDuels() {
    if (!prevRankMap) {
      return `<h2 class="panel-title">Дуелі туру</h2><p class="panel-sub">Порівняння з попереднім туром.</p><div class="state">Ще не було попереднього туру для порівняння.</div>`;
    }
    const items = [];
    for (let i = 0; i < teams.length - 1; i++) {
      const a = teams[i], b = teams[i + 1];
      const pa = prevRankMap.get(a.id), pb = prevRankMap.get(b.id);
      if (pa != null && pb != null && pa > pb) {
        items.push(`<div class="duel-item">🔀 <b>${esc(a.userName)}</b> обійшов ${esc(b.userName)} цього туру (був${pa === pb ? "" : "и"} ${pa}-й проти ${pb}-го)</div>`);
      }
    }
    if (!items.length) {
      return `<h2 class="panel-title">Дуелі туру</h2><p class="panel-sub">Хто кого обійшов у сусідній парі рейтингу цього туру.</p><div class="state">Цього туру порядок сусідніх пар не змінився.</div>`;
    }
    return `
      <h2 class="panel-title">Дуелі туру ${currentRound}</h2>
      <p class="panel-sub">Хто кого обійшов у сусідній парі турнірної таблиці порівняно з попереднім туром.</p>
      <div class="card">${items.join("")}</div>`;
  }

  // =========================================================================
  // TAB: Mini-game — Penalty shootout (arcade, own canvas interface)
  // =========================================================================
  let penShots = Number(localStorage.getItem("ffl_pen_shots") || 0);
  let penGoals = Number(localStorage.getItem("ffl_pen_goals") || 0);
  let penStreak = Number(localStorage.getItem("ffl_pen_streak") || 0);
  let penBest = Number(localStorage.getItem("ffl_pen_best") || 0);
  let penAnimating = false;
  let penInitialized = false;

  function renderGame() {
    return `
      <h2 class="panel-title">Пенальті-шутаут</h2>
      <p class="panel-sub">Клікни у ворота, щоб пробити пенальті. Цілься в кут — воротар намагається вгадати напрямок. Рекорд серії зберігається в браузері.</p>
      <div class="card pen-card">
        <canvas id="penCanvas" width="560" height="300"></canvas>
        <div class="pen-stats">
          <span>Голи: <b id="penGoalsVal">${penGoals}</b>/<b id="penShotsVal">${penShots}</b></span>
          <span>Серія: <b id="penStreakVal">${penStreak}</b></span>
          <span>Рекорд серії: <b id="penBestVal">${penBest}</b></span>
        </div>
        <div id="penMsg" class="pen-msg">Клікни у ворота, щоб почати</div>
        <div class="pen-hint">Порада: кути й дальні точки складніше відбити, ніж центр.</div>
      </div>`;
  }

  function initPenaltyGame() {
    if (penInitialized) return;
    const canvas = document.getElementById("penCanvas");
    if (!canvas) return;
    penInitialized = true;
    const ctx = canvas.getContext("2d");
    const W = canvas.width, H = canvas.height;
    const goal = { x0: 70, x1: W - 70, y0: 40, y1: 160 };
    const ballStart = { x: W / 2, y: H - 20 };
    const keeperHome = { x: W / 2, y: (goal.y0 + goal.y1) / 2 };
    let ball = { ...ballStart };
    let keeper = { ...keeperHome };

    function drawPitch() {
      ctx.fillStyle = "#123f28";
      ctx.fillRect(0, 0, W, H);
      ctx.strokeStyle = "rgba(255,255,255,0.22)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(W / 2, H + 60, 140, Math.PI * 1.18, Math.PI * 1.82);
      ctx.stroke();
      ctx.strokeStyle = "#f3f1e8";
      ctx.lineWidth = 5;
      ctx.strokeRect(goal.x0, goal.y0, goal.x1 - goal.x0, goal.y1 - goal.y0);
      ctx.strokeStyle = "rgba(243,241,232,0.22)";
      ctx.lineWidth = 1;
      for (let x = goal.x0; x <= goal.x1; x += 22) {
        ctx.beginPath(); ctx.moveTo(x, goal.y0); ctx.lineTo(x, goal.y1); ctx.stroke();
      }
      for (let y = goal.y0; y <= goal.y1; y += 20) {
        ctx.beginPath(); ctx.moveTo(goal.x0, y); ctx.lineTo(goal.x1, y); ctx.stroke();
      }
    }

    function drawKeeper() {
      ctx.fillStyle = "#d9b44a";
      if (ctx.roundRect) {
        ctx.beginPath();
        ctx.roundRect(keeper.x - 18, keeper.y - 24, 36, 48, 8);
        ctx.fill();
      } else {
        ctx.fillRect(keeper.x - 18, keeper.y - 24, 36, 48);
      }
      ctx.fillStyle = "#0c2417";
      ctx.font = "bold 10px 'Space Grotesk', sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("GK", keeper.x, keeper.y + 3);
    }

    function drawBall() {
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, 9, 0, Math.PI * 2);
      ctx.fillStyle = "#f3f1e8";
      ctx.fill();
      ctx.strokeStyle = "rgba(0,0,0,0.3)";
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    function draw() {
      drawPitch();
      drawKeeper();
      drawBall();
    }

    function animate(fromBall, toBall, fromKeeper, toKeeper, duration, onDone) {
      const t0 = performance.now();
      function step(t) {
        const p = Math.min(1, (t - t0) / duration);
        const ease = 1 - Math.pow(1 - p, 2);
        ball.x = fromBall.x + (toBall.x - fromBall.x) * ease;
        ball.y = fromBall.y + (toBall.y - fromBall.y) * ease;
        keeper.x = fromKeeper.x + (toKeeper.x - fromKeeper.x) * ease;
        keeper.y = fromKeeper.y + (toKeeper.y - fromKeeper.y) * ease;
        draw();
        if (p < 1) requestAnimationFrame(step);
        else onDone();
      }
      requestAnimationFrame(step);
    }

    function resetBallSoon() {
      setTimeout(() => {
        animate({ ...ball }, ballStart, { ...keeper }, keeperHome, 350, () => {
          ball = { ...ballStart };
          keeper = { ...keeperHome };
          draw();
          penAnimating = false;
        });
      }, 700);
    }

    function shoot(targetX, targetY) {
      if (penAnimating) return;
      penAnimating = true;
      const msgEl = document.getElementById("penMsg");
      if (msgEl) { msgEl.textContent = "…"; msgEl.style.color = ""; }

      const zones = [
        { x: goal.x0 + 38, y: goal.y0 + 25 },
        { x: goal.x1 - 38, y: goal.y0 + 25 },
        { x: (goal.x0 + goal.x1) / 2, y: goal.y0 + 22 },
        { x: goal.x0 + 38, y: goal.y1 - 22 },
        { x: goal.x1 - 38, y: goal.y1 - 22 },
      ];
      const pick = zones[Math.floor(Math.random() * zones.length)];
      const diveTarget = { x: pick.x + (Math.random() * 20 - 10), y: pick.y + (Math.random() * 14 - 7) };

      const fromBall = { ...ball };
      const fromKeeper = { ...keeper };
      animate(fromBall, { x: targetX, y: targetY }, fromKeeper, diveTarget, 420, () => {
        const dist = Math.hypot(targetX - diveTarget.x, targetY - diveTarget.y);
        const saved = dist < 46;
        penShots += 1;
        if (saved) {
          penStreak = 0;
          if (msgEl) { msgEl.textContent = "Воротар відбив! 🧤"; msgEl.style.color = "var(--down)"; }
        } else {
          penGoals += 1;
          penStreak += 1;
          penBest = Math.max(penBest, penStreak);
          if (msgEl) { msgEl.textContent = "ГОООЛ! ⚽"; msgEl.style.color = "var(--up)"; }
        }
        localStorage.setItem("ffl_pen_shots", String(penShots));
        localStorage.setItem("ffl_pen_goals", String(penGoals));
        localStorage.setItem("ffl_pen_streak", String(penStreak));
        localStorage.setItem("ffl_pen_best", String(penBest));
        const g = document.getElementById("penGoalsVal");
        const s = document.getElementById("penShotsVal");
        const st = document.getElementById("penStreakVal");
        const b = document.getElementById("penBestVal");
        if (g) g.textContent = penGoals;
        if (s) s.textContent = penShots;
        if (st) st.textContent = penStreak;
        if (b) b.textContent = penBest;
        resetBallSoon();
      });
    }

    canvas.addEventListener("click", (e) => {
      const rect = canvas.getBoundingClientRect();
      const scaleX = W / rect.width;
      const scaleY = H / rect.height;
      const x = (e.clientX - rect.left) * scaleX;
      const y = (e.clientY - rect.top) * scaleY;
      const tx = Math.min(goal.x1 - 12, Math.max(goal.x0 + 12, x));
      const ty = Math.min(goal.y1 - 12, Math.max(goal.y0 + 12, y));
      shoot(tx, ty);
    });

    draw();
  }

  const renderers = {
    table: renderTable,
    chips: renderChips,
    captains: renderCaptains,
    transfers: renderTransfers,
    bench: renderBench,
    ownership: renderOwnership,
    diffs: renderDiffs,
    duels: renderDuels,
    game: renderGame,
  };

  // Build tab bar
  const tabsNav = document.getElementById("tabs");
  tabsNav.innerHTML = TABS.map((t, i) => `<button data-tab="${t.id}" class="${i === 0 ? "active" : ""}">${esc(t.label)}</button>`).join("");

  // Build panels
  const mainEl = document.getElementById("main");
  mainEl.innerHTML = TABS.map((t, i) => `<section class="panel${i === 0 ? " active" : ""}" id="panel-${t.id}"></section>`).join("");
  TABS.forEach((t) => {
    try {
      document.getElementById("panel-" + t.id).innerHTML = renderers[t.id]();
    } catch (e) {
      document.getElementById("panel-" + t.id).innerHTML = `<div class="state error">Помилка відображення: ${esc(e.message)}</div>`;
    }
  });
  initPenaltyGame();

  tabsNav.addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-tab]");
    if (!btn) return;
    const id = btn.dataset.tab;
    tabsNav.querySelectorAll("button").forEach((b) => b.classList.toggle("active", b === btn));
    mainEl.querySelectorAll("section.panel").forEach((s) => s.classList.toggle("active", s.id === "panel-" + id));
  });

  // =========================================================================
  // Team detail modal (click any manager name to open)
  // =========================================================================
  const POSITION_ORDER = ["GK", "DEF", "MID", "FWD"];
  const POSITION_LABELS = { GK: "Воротар", DEF: "Захист", MID: "Півзахист", FWD: "Атака" };
  const modalOverlay = document.getElementById("teamModal");
  const modalCard = document.getElementById("teamModalCard");
  let modalTeamId = null;
  let modalRound = null;

  function squadPlayerRow(id, round, opts) {
    opts = opts || {};
    const p = playerMap.get(id);
    const pts = playerRoundPoints(id, round);
    const abbr = playerSquadAbbr(id);
    let badges = "";
    if (opts.captain) badges += `<span class="badge" title="Капітан">C</span>`;
    if (opts.vice) badges += `<span class="badge v" title="Віце-капітан">V</span>`;
    if (opts.autoIn) badges += `<span class="badge v" title="Вийшов на заміну">AUTO</span>`;
    return `
      <div class="squad-player${opts.out ? " out" : ""}">
        <span>${esc(playerName(id))}${abbr ? ` <span class="psub">· ${esc(abbr)}</span>` : ""}${badges}</span>
        <span class="points-sm">${pts} очок</span>
      </div>`;
  }

  // ---- Football-pitch formation view for the starting XI ----
  function pitchCard(id, round, opts) {
    opts = opts || {};
    const pts = playerRoundPoints(id, round);
    const abbr = playerSquadAbbr(id);
    const name = playerName(id);
    const shortName = name.split(" ").pop();
    let badge = "";
    if (opts.captain) badge = `<span class="badge2" title="Капітан">C</span>`;
    else if (opts.vice) badge = `<span class="badge2" title="Віце-капітан">V</span>`;
    return `
      <div class="pitch-card" title="${esc(name)}">
        <div class="dot">${esc(abbr || "")}${badge}</div>
        <div class="pname2">${esc(shortName)}</div>
        <div class="pts2">${pts}</div>
      </div>`;
  }

  function pitchHtml(rd, round) {
    const order = ["FWD", "MID", "DEF", "GK"];
    const rowsHtml = order.filter((pos) => rd.lineup && rd.lineup[pos] && rd.lineup[pos].length).map((pos) => {
      const cards = rd.lineup[pos].map((id) => pitchCard(id, round, { captain: id === rd.captain, vice: id === rd.vice })).join("");
      return `<div class="pitch-row">${cards}</div>`;
    }).join("");
    return `<div class="pitch-wrap"><div class="pitch">${rowsHtml}</div></div>`;
  }

  // ---- Bigger round-by-round form chart ----
  function bigChart(team) {
    const values = rounds.map((r) => (team.rounds && team.rounds[String(r)] ? (team.rounds[String(r)].roundPoints || 0) : 0));
    const w = 560, h = 150, padL = 10, padR = 10, padT = 20, padB = 20;
    const max = Math.max(...values, 1);
    const min = Math.min(...values, 0);
    const range = (max - min) || 1;
    const innerW = w - padL - padR;
    const innerH = h - padT - padB;
    const stepX = innerW / Math.max(values.length - 1, 1);
    const pts = values.map((v, i) => ({
      x: padL + i * stepX,
      y: padT + innerH - ((v - min) / range) * innerH,
      v, r: rounds[i],
    }));
    const line = pts.map((p) => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(" ");
    const area = `${padL},${(padT + innerH).toFixed(1)} ${line} ${(padL + innerW).toFixed(1)},${(padT + innerH).toFixed(1)}`;
    const dots = pts.map((p) => `
      <circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3.4" fill="#d9b44a"/>
      <text x="${p.x.toFixed(1)}" y="${(p.y - 8).toFixed(1)}" font-size="9" fill="#f3f1e8" text-anchor="middle">${p.v}</text>
      <text x="${p.x.toFixed(1)}" y="${h - 6}" font-size="9" fill="rgba(243,241,232,0.45)" text-anchor="middle">Т${p.r}</text>`).join("");
    return `
      <svg viewBox="0 0 ${w} ${h}" class="big-chart" preserveAspectRatio="none" style="width:100%;height:150px;">
        <defs><linearGradient id="chartFill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#d9b44a" stop-opacity="0.35"/>
          <stop offset="100%" stop-color="#d9b44a" stop-opacity="0"/>
        </linearGradient></defs>
        <polygon points="${area}" fill="url(#chartFill)"/>
        <polyline points="${line}" fill="none" stroke="#d9b44a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
        ${dots}
      </svg>`;
  }

  // ---- Transfer history (diffs the cumulative per-round transfer list) ----
  function buildTransferHistory(team) {
    const events = [];
    let prevLen = 0;
    for (let r = 1; r <= currentRound; r++) {
      const rd = team.rounds && team.rounds[String(r)];
      if (!rd) continue;
      const list = rd.transfers || [];
      if (list.length > prevLen) {
        list.slice(prevLen).forEach((tr) => events.push({ round: r, out: tr.out, in: tr.in, isNegative: tr.isNegative }));
      }
      prevLen = Math.max(prevLen, list.length);
    }
    return events;
  }

  function transferHistoryHtml(team) {
    const events = buildTransferHistory(team);
    if (!events.length) return `<div class="psub">Трансферів ще не було.</div>`;
    return events.slice().reverse().map((ev) => `
      <div class="transfer-item">
        <span><span class="tout">${esc(playerName(ev.out))}</span> → <span class="tin">${esc(playerName(ev.in))}</span></span>
        <span class="psub">Тур ${ev.round}${ev.isNegative ? ` · <span class="pill bad">хіт</span>` : ""}</span>
      </div>`).join("");
  }

  function buildTeamDetail(teamId, round) {
    const team = teams.find((t) => t.id === teamId);
    if (!team) return `<div class="state error">Команду не знайдено.</div>`;
    const rd = team.rounds && team.rounds[String(round)];
    const rankNow = currRankMap.get(teamId) ?? team.overallRank;

    const roundButtons = rounds.map((r) =>
      `<button data-round="${r}" class="${r === round ? "active" : ""}">Тур ${r}</button>`
    ).join("");

    if (!rd) {
      return `
        <button class="modal-close" data-close>×</button>
        <div class="modal-head">
          <img class="avatar" src="${esc(team.avatar || "")}" alt="" onerror="this.style.visibility='hidden'">
          <div><h3>${esc(team.userName)}</h3><div class="psub">Немає даних за цей тур</div></div>
        </div>
        <div class="round-picker">${roundButtons}</div>
        <div class="state">Дані по цьому туру ще не завантажені.</div>`;
    }

    const autoIn = new Set((rd.substitutions || []).filter((s) => s.isAuto).map((s) => s.in));

    const lineupHtml = pitchHtml(rd, round);

    const benchIds = flattenRoster(rd.bench);
    const benchHtml = benchIds.length ? `
      <div class="squad-group">
        <h4>Лава запасних</h4>
        ${benchIds.map((id) => squadPlayerRow(id, round, { autoIn: autoIn.has(id) })).join("")}
      </div>` : "";

    // MVP / bust of the full 15-man roster, by season-long total points
    const roster = [...flattenRoster(rd.lineup), ...benchIds];
    const withTotals = roster.map((id) => {
      const p = playerMap.get(id);
      return { id, total: p && p.stats ? (p.stats.totalPoints || 0) : 0 };
    }).filter((x) => playerMap.has(x.id));
    let mvp = null, bust = null;
    withTotals.forEach((x) => {
      if (!mvp || x.total > mvp.total) mvp = x;
      if (!bust || x.total < bust.total) bust = x;
    });

    const chipsHtml = CHIP_FIELDS.map(([field, label]) => {
      const val = rd[field];
      const roundNum = chipRound(val);
      if (roundNum == null) return `<span class="pill off">${esc(label)}: —</span>`;
      const extra = (val && typeof val === "object" && val.playerId) ? ` · ${playerName(val.playerId)}` : "";
      return `<span class="pill">${esc(label)}: тур ${roundNum}${esc(extra)}</span>`;
    }).join(" ");

    const transfers = rd.transfers || [];
    const hits = transfers.filter((x) => x.isNegative).length;

    return `
      <button class="modal-close" data-close>×</button>
      <div class="modal-head">
        <img class="avatar" src="${esc(team.avatar || "")}" alt="" onerror="this.style.visibility='hidden'">
        <div>
          <h3>${esc(team.userName)}</h3>
          <div class="psub">Місце ${rankNow ?? "—"} · Вартість складу ${rd.value != null ? rd.value : "—"}М</div>
        </div>
      </div>

      <div class="modal-stats">
        <div class="stat"><div class="v">${rd.roundPoints ?? "—"}</div><div class="l">Очки туру</div></div>
        <div class="stat"><div class="v">${rd.overallPoints ?? "—"}</div><div class="l">Всього очок</div></div>
        <div class="stat"><div class="v">${transfers.length}</div><div class="l">Трансфери</div></div>
        <div class="stat"><div class="v">${hits}</div><div class="l">Хіти</div></div>
      </div>

      <div class="squad-group">
        <h4>Форма по турах</h4>
        ${bigChart(team)}
      </div>

      <div class="round-picker">${roundButtons}</div>

      ${lineupHtml}
      ${benchHtml}

      <div class="mini-cards">
        <div class="mini-card">
          <div class="l">🔥 MVP складу (сезон)</div>
          <div class="n">${mvp ? esc(playerName(mvp.id)) : "—"}</div>
          <div class="p">${mvp ? mvp.total + " очок за сезон" : ""}</div>
        </div>
        <div class="mini-card">
          <div class="l">📉 Провал складу (сезон)</div>
          <div class="n">${bust ? esc(playerName(bust.id)) : "—"}</div>
          <div class="p">${bust ? bust.total + " очок за сезон" : ""}</div>
        </div>
      </div>

      <div class="squad-group">
        <h4>Чіпи цієї команди</h4>
        <div style="display:flex; flex-wrap:wrap; gap:6px;">${chipsHtml}</div>
      </div>

      <div class="squad-group">
        <h4>Історія трансферів</h4>
        ${transferHistoryHtml(team)}
      </div>`;
  }

  function renderModal() {
    if (modalTeamId == null) return;
    modalCard.innerHTML = buildTeamDetail(modalTeamId, modalRound);
  }

  function openTeamModal(teamId) {
    modalTeamId = teamId;
    modalRound = currentRound;
    renderModal();
    modalOverlay.hidden = false;
  }

  function closeTeamModal() {
    modalOverlay.hidden = true;
    modalTeamId = null;
  }

  document.addEventListener("click", (e) => {
    const link = e.target.closest("[data-team]");
    if (link) {
      openTeamModal(link.dataset.team);
      return;
    }
    if (e.target.closest("[data-close]") || e.target === modalOverlay) {
      closeTeamModal();
      return;
    }
    const roundBtn = e.target.closest(".round-picker button[data-round]");
    if (roundBtn && !modalOverlay.hidden) {
      modalRound = Number(roundBtn.dataset.round);
      renderModal();
      return;
    }
    const chipToggleBtn = e.target.closest(".filter-row button[data-chiptoggle]");
    if (chipToggleBtn) {
      const field = chipToggleBtn.dataset.chiptoggle;
      if (chipFilterSelected.has(field)) chipFilterSelected.delete(field);
      else chipFilterSelected.add(field);
      const panel = document.getElementById("panel-table");
      if (panel) panel.innerHTML = renderTable();
      return;
    }
    const chipModeBtn = e.target.closest(".chip-mode-row button[data-chipmode]");
    if (chipModeBtn) {
      chipFilterMode = chipModeBtn.dataset.chipmode;
      const panel = document.getElementById("panel-table");
      if (panel) panel.innerHTML = renderTable();
      return;
    }
    const chipResetBtn = e.target.closest("[data-chipreset]");
    if (chipResetBtn) {
      chipFilterSelected.clear();
      chipFilterMode = "any";
      const panel = document.getElementById("panel-table");
      if (panel) panel.innerHTML = renderTable();
      return;
    }
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") closeTeamModal();
  });

  document.getElementById("updated").textContent = fmtDate(history.updated_at);
}

main().catch((err) => {
  document.getElementById("updated").textContent = "Помилка оновлення";
  document.getElementById("main").innerHTML = `<div class="state error">Несподівана помилка: ${esc(err.message)}</div>`;
});
</script>
</body>
</html>
